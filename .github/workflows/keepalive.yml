name: Scheduled Workflow Keepalive

on:
  workflow_dispatch:
  schedule:
    # Create repository activity every month, safely inside GitHub's 60-day inactivity window.
    - cron: "17 9 1 * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: scheduled-workflow-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh keepalive marker
        shell: bash
        run: |
          printf 'Last scheduled-workflow keepalive: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

      - name: Commit keepalive activity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No keepalive change needed."
            exit 0
          fi
          git commit -m "chore: refresh scheduled workflow keepalive"
          git push
