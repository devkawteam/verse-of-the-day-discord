name: Verse of the Day to Multiple Discords

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *" # 7:00 AM Eastern

jobs:
  post-verse:
    runs-on: ubuntu-latest

    steps:
      - name: Post Verse of the Day
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
          DISCORD_WEBHOOK_TWO: ${{ secrets.DISCORD_WEBHOOK_TWO }}
          DISCORD_WEBHOOK_THREE: ${{ secrets.DISCORD_WEBHOOK_THREE }}

        run: |
          VERSE=$(curl -s https://beta.ourmanna.com/api/v1/get/?format=text)

          DATE=$(date +"%B %d, %Y")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ########################################
          # MAIN DISCORD
          ########################################
          curl -H "Content-Type: application/json" -X POST \
          -d "{
            \"username\": \"KAW Scripture Bot\",
            \"embeds\": [{
              \"title\": \"📖 Verse of the Day\",
              \"description\": \"$VERSE\",
              \"color\": 3447003,
              \"fields\": [
                {
                  \"name\": \"🙏 Reflection\",
                  \"value\": \"Take a quiet moment to reflect on today's message.\"
                }
              ],
              \"footer\": {
                \"text\": \"KAW Daily Scripture • $DATE\"
              },
              \"timestamp\": \"$TIMESTAMP\"
            }]
          }" \
          "$DISCORD_WEBHOOK_MAIN"

          ########################################
          # SECOND DISCORD
          ########################################
          curl -H "Content-Type: application/json" -X POST \
          -d "{
            \"username\": \"Daily Encouragement\",
            \"embeds\": [{
              \"title\": \"🕊️ Daily Scripture\",
              \"description\": \"$VERSE\",
              \"color\": 5763719,
              \"fields\": [
                {
                  \"name\": \"✨ Encouragement\",
                  \"value\": \"Carry this verse with you throughout your day.\"
                }
              ],
              \"footer\": {
                \"text\": \"God's Word • $DATE\"
              },
              \"timestamp\": \"$TIMESTAMP\"
            }]
          }" \
          "$DISCORD_WEBHOOK_TWO"

          ########################################
          # THIRD DISCORD
          ########################################
          curl -H "Content-Type: application/json" -X POST \
          -d "{
            \"username\": \"Morning Scripture\",
            \"embeds\": [{
              \"title\": \"🌅 Scripture for Today\",
              \"description\": \"$VERSE\",
              \"color\": 15844367,
              \"fields\": [
                {
                  \"name\": \"💬 Discussion\",
                  \"value\": \"What does this verse mean to you today?\"
                }
              ],
              \"footer\": {
                \"text\": \"Daily Inspiration • $DATE\"
              },
              \"timestamp\": \"$TIMESTAMP\"
            }]
          }" \
          "$DISCORD_WEBHOOK_THREE"
